<!DOCTYPE html>
<html>
<head>
    <title>Test Return Book</title>
</head>

<body>

<h2>Test Return Book</h2>

<button onclick="returnBook()">Return Python Programming</button>

<pre id="result"></pre>

<script>

async function returnBook() {

    try {

        const response = await fetch(
            "http://localhost:3000/api/records/return",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    record_id: 5
                })
            }
        );

        const data = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        document.getElementById("result").textContent =
            "Error: " + error.message;

    }

}

</script>

</body>
</html>
